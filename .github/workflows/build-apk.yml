name: Build Pochi APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Pochi Debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Write build errors to summary
        if: failure()
        run: |
          {
            echo "### Build failure"
            echo '```'
            grep -nE "(^e: |error:|FAILURE:|What went wrong|Android resource linking failed|Unresolved reference|Caused by:)" build.log | head -100 || true
            echo '```'
            echo "### Last 120 lines"
            echo '```'
            tail -120 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pochi APK
        uses: actions/upload-artifact@v4
        with:
          name: Pochi-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
