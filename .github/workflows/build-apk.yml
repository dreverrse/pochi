name: Build Pochi APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract version
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n1)
          echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Build Pochi APK
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "Pochi-${{ steps.version.outputs.version }}.apk"

      - name: Write build errors to summary
        if: failure()
        run: |
          {
            echo "### Build failure"
            echo '```'
            grep -nE "(^e: |error:|FAILURE:|What went wrong|Android resource linking failed|Unresolved reference|Caused by:)" build.log | head -100 || true
            echo '```'
            echo "### Last 120 lines"
            echo '```'
            tail -120 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pochi APK
        uses: actions/upload-artifact@v4
        with:
          name: Pochi-Android-APK
          path: Pochi-${{ steps.version.outputs.version }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Pochi v${{ steps.version.outputs.version }}
          body: |
            Pochi Android APK build ${{ steps.version.outputs.version }}
            Commit: ${{ github.sha }}
          files: Pochi-${{ steps.version.outputs.version }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
