name: Build Pochi APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ensure release keystore
        run: |
          if [ ! -f pochi-release.jks ]; then
            keytool -genkeypair -keystore pochi-release.jks -alias pochi -keyalg RSA -keysize 2048 -validity 10000 -storepass pochi-release -keypass pochi-release -dname "CN=Pochi, O=Pochi, C=ID"
            git config user.name "Pochi CI"
            git config user.email "pochi@users.noreply.github.com"
            git add pochi-release.jks
            git commit -m "chore: add release keystore [skip ci]"
            git push
          fi

      - name: Build Pochi Release APK
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Write build errors to summary
        if: failure()
        run: |
          {
            echo "### Build failure"
            echo '```'
            grep -nE "(^e: |error:|FAILURE:|What went wrong|Android resource linking failed|Unresolved reference|Caused by:)" build.log | head -100 || true
            echo '```'
            echo "### Last 120 lines"
            echo '```'
            tail -120 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "(^e: |error:|FAILURE:|What went wrong|Unresolved reference|Caused by:)" build.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done || true
          tail -30 build.log | while IFS= read -r line; do echo "::error::$line"; done || true

      - name: Upload Pochi APK
        uses: actions/upload-artifact@v4
        with:
          name: Pochi-Android-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Pochi v${{ steps.version.outputs.version }}
          body: |
            Pochi Android APK build ${{ steps.version.outputs.version }}
            Commit: ${{ github.sha }}
          files: app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
