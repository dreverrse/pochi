name: Build Pochi APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/pochi-release.p12"
          if [ -n "${POCHI_KEYSTORE_BASE64:-}" ]; then
            echo "$POCHI_KEYSTORE_BASE64" | base64 --decode > "$KS"
            echo "Keystore signing disiapkan di $KS"
          else
            echo "Tidak ada secret keystore — fallback ke debug signing"
          fi
          POCHI_KEYSTORE_FILE="$KS" gradle --no-daemon assembleRelease
        env:
          POCHI_KEYSTORE_BASE64: ${{ secrets.POCHI_KEYSTORE_BASE64 }}
          POCHI_KEYSTORE_PASSWORD: ${{ secrets.POCHI_KEYSTORE_PASSWORD }}
          POCHI_KEYSTORE_ALIAS: ${{ secrets.POCHI_KEYSTORE_ALIAS }}
          POCHI_KEYSTORE_KEY_PASSWORD: ${{ secrets.POCHI_KEYSTORE_KEY_PASSWORD }}

      - name: Upload APK (release)
        uses: actions/upload-artifact@v4
        with:
          name: pochi-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK (debug)
        uses: actions/upload-artifact@v4
        with:
          name: pochi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
